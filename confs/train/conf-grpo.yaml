# File Paths
data_path: "data/split-dataset"
repos_path: "data/"
model_name: "models/proofmindrl-cot"
output_dir: "models/proofmindrl-cot-grpo"
train_type: "unsloth-grpo"

# Training Args
hard_seq_len: 4096
per_device_train_batch_size: 4
learning_rate: 1.0e-3
num_train_epochs: 1
max_steps: 5000
peft_lora_r: 64
peft_lora_alpha: 16

temperature: 1.0
num_generations: 8

# Basic
# example_collator:
#   alias: basic
#   state_tokens: 2640
#   script_tokens: 1320
#   out_tokens: 128 

# Proofs And Premises
example_collator:
   alias: reasoning
   state_tokens: 1024 
   script_tokens: 512
   proof_tokens: 1024 
   premise_tokens: 512 
   out_tokens: 1024 

# Premises only
# example_collator:
#   alias: premise
#   state_tokens: 1024 
#   script_tokens: 512
#   premise_tokens: 1536 
#   out_tokens: 128 

# Proofs only
# example_collator:
#  alias: proof 
#  state_tokens: 1024 
