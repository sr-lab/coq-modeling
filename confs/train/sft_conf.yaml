# File Paths
data_path: "data/split-dataset"
repos_path: "data/"
model_name: "unsloth/Qwen3-30B-A3B-Base-bnb-4bit"
output_dir: "models/proofmindrl-sft-trained"
train_type: unsloth-sft

# Training Args
hard_seq_len: 4096
per_device_train_batch_size: 64
learning_rate: 5.0e-5
num_train_epochs: 1
max_steps: 16000
peft_lora_r: 16
peft_lora_alpha: 16

gradient_accumulation_steps: 2
temperature: 0.7
num_generations: 16

# Basic
# example_collator:
#   alias: basic
#   state_tokens: 2640
#   script_tokens: 1320
#   out_tokens: 128 

# Proofs And Premises
example_collator:
   alias: sft
   state_tokens: 1024 
   script_tokens: 512
   proof_tokens: 1024 
   premise_tokens: 512 
   out_tokens: 128 

# Premises only
# example_collator:
#   alias: premise
#   state_tokens: 1024 
#   script_tokens: 512
#   premise_tokens: 1536 
#   out_tokens: 128 

# Proofs only
# example_collator:
#  alias: proof 
#  state_tokens: 1024 
#  script_tokens: 512
#  proof_tokens: 1536 
#  out_tokens: 128 

# Prev lines 
# example_collator:
#   alias: n-prev-line 
#   state_tokens: 1024 
#   script_tokens: 512
#   prefix_tokens: 1536
#   out_tokens: 128 
#   data_loc: raw-data/coq-dataset
#   line_dict_loc: data/line-dict.json

# Evaluation Args
eval_steps: 100 
save_steps: 100
eval_accumulation_steps: 1
per_device_eval_batch_size: 8
num_eval_examples: 2000 # Evaluation would take ~2 hours each time w/o limiting this

# Logging Args
logging_steps: 20
save_total_limit: 100

